services:
  jvb:
    image: docker.io/jitsi/jvb:jvb-2.3-291-gb4b5ccc8c-1
    restart: unless-stopped
    ports:
      - "31000:10000/udp"
    volumes:
      - /home/farid/jitsi/config/jvb:/config
    environment:
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jitsi123
      - JVB_HOST=jvb
      - JVB_BREWERY_MUC_JVB_BREAKAUTH_VISITOR=
      - JVB_OCTO_REGION=region1
      - JVB_STUN_SERVERS=stun.l.google.com:19302,stun1.l.google.com:19302
      - PUBLIC_URL=https://jitsi.pydev.my.id
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=jitsi.pydev.my.id
      - XMPP_AUTH_DOMAIN=auth.jitsi.pydev.my.id
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.jitsi.pydev.my.id
      - TZ=Asia/Jakarta
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    networks:
      - jitsinet

  web:
    image: docker.io/jitsi/web:web-1.0.9207-1
    restart: unless-stopped
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - /home/farid/jitsi/config/jitsi-meet:/config
      - /home/farid/jitsi/config/transcripts:/usr/share/jitsi-meet/transcripts
    environment:
      - PUBLIC_URL=https://jitsi.pydev.my.id
      - XMPP_DOMAIN=jitsi.pydev.my.id
      - XMPP_BOSH_URL_BASE=http://prosody:5280/http-bind
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=jitsi123
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jitsi123
      - JVB_HOST=jvb
      - JICOFO_HOST=jicofo
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - ENABLE_LETSENCRYPT=0
      - DISABLE_HTTPS=1
      - JWT_APP_SECRET=your-jitsi-secret-key-change-in-production
      - TZ=Asia/Jakarta
    depends_on:
      - jvb
      - prosody
    networks:
      - jitsinet

  jicofo:
    image: docker.io/jitsi/jicofo:unstable
    restart: unless-stopped
    volumes:
      - /home/farid/jitsi/config/jicofo:/config
    environment:
      - PUBLIC_URL=https://jitsi.pydev.my.id
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=jitsi.pydev.my.id
      - XMPP_AUTH_DOMAIN=auth.jitsi.pydev.my.id
      - XMPP_MUC_DOMAIN=muc.jitsi.pydev.my.id
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.jitsi.pydev.my.id
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=jitsi123
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jitsi123
      - JVB_HOST=jvb
      - JICOFO_CONF_SECRET=jicofo-secret
      - ENABLE_SIP=0
      - TZ=Asia/Jakarta
    depends_on:
      - jvb
      - prosody
    networks:
      - jitsinet

  prosody:
    image: docker.io/jitsi/prosody:unstable
    restart: unless-stopped
    volumes:
      - /home/farid/jitsi/config/prosody/config:/config
      - /home/farid/jitsi/config/prosody/plugins:/prosody-plugins-custom:ro
    environment:
      - PUBLIC_URL=https://jitsi.pydev.my.id
      - XMPP_DOMAIN=jitsi.pydev.my.id
      - XMPP_GUEST_DOMAIN=guest.jitsi.pydev.my.id
      - XMPP_AUTH_DOMAIN=auth.jitsi.pydev.my.id
      - XMPP_MUC_DOMAIN=muc.jitsi.pydev.my.id
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.jitsi.pydev.my.id
      - JITSI_DOMAIN=jitsi.pydev.my.id
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - AUTH_TYPE=token
      - PROSODY_AUTH_TYPE=jwt
      - JWT_AUTH_TYPE=token
      - JWT_APP_SECRET=your-jitsi-secret-key-change-in-production
      - JWT_APP_ID=iqra-app
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=jitsi123
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jitsi123
      - TZ=Asia/Jakarta
    networks:
      - jitsinet

networks:
  jitsinet:
    name: jitsi-net
